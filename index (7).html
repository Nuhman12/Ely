<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elysium Core | Unapologetic Comfort. Everyday Luxury.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--nude:#ead9cd;--blush:#f6e1dc;--taupe:#8b7a6f;--ch:#2b2725;--soft:#6e625b;--line:#eadfd8;--serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.7 var(--sans);color:var(--ch);background:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}h1,h2,h3,h4{font-optical-sizing:auto;font-weight:400}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--taupe);outline-offset:3px}
.ann{background:var(--ch);color:#fff;text-align:center;font-size:12px;padding:9px 12px;letter-spacing:.18em;font-weight:500;text-transform:uppercase}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4vw;max-width:1500px;margin:auto}
.logo{font:500 23px var(--serif);letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
nav.mn{display:flex;gap:30px;font-size:12px;font-weight:500;letter-spacing:.17em;text-transform:uppercase}
nav.mn button{position:relative;padding:6px 0}
nav.mn button::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ch);transform:scaleX(0);transform-origin:right;transition:transform .4s}
nav.mn button:hover::after{transform:scaleX(1);transform-origin:left}
.ico{display:flex;gap:4px}.ico button{position:relative;padding:8px}.mb{display:none}
.cnt{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--ch);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-block;background:var(--ch);color:#fff;padding:17px 40px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:500;transition:background .4s,transform .3s;position:relative;overflow:hidden;text-align:center}
.btn:hover{background:var(--taupe);transform:translateY(-2px)}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh 4s 2s infinite}
@keyframes sh{to{left:140%}}
.btn.o{background:none;color:var(--ch);border:1px solid var(--ch)}.btn.o:hover{background:var(--ch);color:#fff}
.btn.sm{padding:11px 24px}.btn.wide{width:100%;margin-top:18px}
.lk{text-decoration:underline;font-size:14px;color:var(--soft)}

.hero h1{font:400 clamp(40px,6vw,92px)/1.04 var(--serif);letter-spacing:-.015em;margin:16px 0 22px}
.eyebrow{font-weight:500;letter-spacing:.38em;text-transform:uppercase;font-size:11px;color:var(--taupe)}
.hero .l{max-width:42ch;color:var(--soft);margin:0 0 32px;font-size:18px;line-height:1.75;font-weight:300}
.up{animation:up 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}@keyframes up{from{opacity:0;transform:translateY(44px)}}
.hi{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hi img{width:100%;height:min(62vh,540px);object-fit:cover;border-radius:220px 220px 6px 6px;animation:hia 3.4s cubic-bezier(.65,0,.25,1) both,fl 7s ease-in-out 3.5s infinite}
.hi img:nth-child(2){margin-top:60px;border-radius:6px 6px 220px 220px;animation:hib 3.4s cubic-bezier(.65,0,.25,1) both,fl 7s ease-in-out 3.5s infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 4vw;background:var(--blush);text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sec{padding:80px 4vw;max-width:1500px;margin:auto}
.st{font:400 clamp(30px,4vw,54px)/1.14 var(--serif);letter-spacing:-.01em;text-align:center;margin:0 0 12px}.ss{text-align:center;color:var(--soft);margin:0 0 40px;font:italic 400 19px/1.5 var(--serif)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--blush);text-align:left}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.cat:hover img{transform:scale(1.09)}
.cat span{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 16px;background:linear-gradient(transparent,rgba(43,39,37,.66));color:#fff;font:500 20px/1.15 var(--serif);letter-spacing:.01em}
.cat small{display:block;font:400 10.5px var(--sans);letter-spacing:.24em;text-transform:uppercase;margin-top:4px}
.rv{opacity:0;transform:translateY(44px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--dl,0s)}.rv.in{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 20px}
.car{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,23%);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}.car>*{scroll-snap-align:start}
.arw{display:flex;justify-content:flex-end;gap:8px;margin:-20px 0 18px}.arw button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:20px;transition:.3s}.arw button:hover{background:var(--ch);color:#fff}
.pm{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--blush)}
.pi{display:block;height:100%}.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.pi .b{opacity:0;transform:scale(1.3)}.pm:hover .b{opacity:1;transform:scale(1.65)}.pm:hover .a{transform:scale(1.05)}
.hb{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2;transition:transform .3s}.hb:hover{transform:scale(1.14)}.hb.on svg{fill:#c4607a;stroke:#c4607a}
.bd{position:absolute;top:12px;left:12px;background:#fff;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;z-index:2}
.qa{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;transform:translateY(150%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:2}.pm:hover .qa{transform:none}
.qa button{flex:1;background:rgba(255,255,255,.96);padding:11px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.qa button:last-child{background:var(--ch);color:#fff}
@media(hover:none){.qa{transform:none}}
.pt{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14.5px;letter-spacing:.02em}.pt a{font-weight:400}.pt b{font-weight:500;white-space:nowrap}
.stars{display:flex;align-items:center;gap:2px;color:#b8892e;margin-top:2px}.stars small{color:var(--soft);margin-left:6px;font-size:12px}

.sizes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:34px 0}
.sizes span{width:66px;height:66px;border-radius:50%;border:1px solid var(--taupe);display:grid;place-items:center;font:500 16px var(--serif);background:#fff;transform:scale(.3);opacity:0;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .5s;transition-delay:calc(var(--i)*.08s)}.phil.in .sizes span{transform:none;opacity:1}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;text-align:left}.feat div{background:rgba(255,255,255,.92);padding:26px;border:1px solid var(--line)}.feat h4{font:500 19px/1.25 var(--serif);margin:0 0 8px}.feat p{margin:0;color:var(--soft)}
.nl{background:var(--blush);text-align:center;padding:80px 4vw}.nl form{display:flex;gap:0;max-width:480px;margin:22px auto 0}.nl input{flex:1;padding:15px;border:1px solid var(--ch);border-right:0;font:inherit;background:#fff;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}.bar select{border:1px solid var(--line);padding:9px;background:#fff;font:inherit}.fb{display:none}
.shop{display:grid;grid-template-columns:240px 1fr;gap:40px}
.fl>div{padding:18px 0;border-bottom:1px solid var(--line)}.fl h4{font:500 11.5px var(--sans);letter-spacing:.24em;text-transform:uppercase;margin:0 0 12px}.fl label{display:flex;gap:10px;margin:6px 0;cursor:pointer;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);min-width:46px;padding:9px 10px;font-size:13px;transition:.25s}.chip:hover{border-color:var(--ch)}.chip.on{background:var(--ch);color:#fff;border-color:var(--ch)}.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sw.big{width:26px;height:26px;cursor:pointer}.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ch)}
input[type=range]{width:100%;accent-color:var(--taupe)}.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--soft)}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:5vw;padding-top:40px}
.gal{display:grid;grid-template-columns:78px 1fr;gap:14px;align-self:start;position:sticky;top:100px}.thumbs{display:grid;gap:10px;align-content:start}
.th{aspect-ratio:3/4;overflow:hidden;border:1px solid transparent}.th.on{border-color:var(--ch)}.th img,.main img{width:100%;height:100%;object-fit:cover}
.main{aspect-ratio:3/4;overflow:hidden;background:var(--blush)}.main img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.t1{transform:scale(1.9);transform-origin:50% 14%}.t2{transform:scale(1.9);transform-origin:50% 86%}
